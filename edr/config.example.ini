#
# Sentinel EDR. Everything it decides with is here.
#
# The one rule worth knowing before changing any of it: rate alone never makes
# this daemon do anything. Files-per-minute is worth one point out of the five
# it takes to act, because a phone finishing its first backup and a folder being
# encrypted look identical if that is all you count.

[sentinel-edr]
# Where the accounts' files live. Only <data_dir>/<account>/files/... is looked
# at; everything else on the filesystem is discarded in the first few lines.
data_dir = /var/www/nextcloud/data

# Where reports are left for Nextcloud to pick up. Nextcloud reads and removes
# them; it never writes here.
spool = /var/lib/sentinel-edr/spool

# How to ask Nextcloud to end an account's sessions. Left empty, the daemon
# reports and nothing more. No credential is stored anywhere for this.
#
# occ refuses to run as root, so the daemon drops to the account that owns the
# installation before running it — dropping privilege, never taking it. Do not
# put sudo here: it cannot work under NoNewPrivileges, and the sudoers rule it
# would need is itself a way in.
# occ = php /var/www/nextcloud/occ
# occ_user = www-data

# The window everything is counted over, in seconds.
window = 300

# How many files in that window before rate counts as a signal at all.
# Worth one point. Never enough on its own.
rate_floor = 400

# Files whose contents no longer match their own name. This is the signal that
# does the work: no legitimate client rewrites a .jpg so that it stops being a
# JPEG. Worth four points, and six when the sample is large and nearly all wrong.
mismatch_floor = 5
mismatch_ratio = 50

# One in how many files is opened and checked, once the rate is halfway to
# rate_floor. Before that point nothing is read at all.
sample_every = 3

# How many files a program that is not on the expected list has to write before
# that counts. Worth three points.
stranger_floor = 20

# What to do when the score reaches five and the writer is a program that has no
# business being there.
#   suspend  freeze it exactly where it stands; reversible, and a person decides
#   kill     end it
#   report   write the report and touch nothing
# php-fpm is never touched whatever this says: stopping it stops Nextcloud for
# everybody, which would be a more reliable way to lose the server than most of
# what is being watched for.
response = suspend

# Ask Nextcloud to sign that account out of everything. A sync client holds a
# token and does not care that anything else happened.
end_sessions = true

# And to disable the account entirely. Off, because it is the one action here
# that a person cannot undo without noticing.
disable_account = false

# Programs that are supposed to write into a data directory. Add your backup and
# migration tools here, or they will be treated as strangers.
expected = php-fpm,php,apache2,httpd,nginx,occ,rsync,cp,mv,tar

# Paths that are never of interest, matched anywhere in the full path.
ignore_paths = /files_trashbin/,/files_versions/,/appdata_,/.ocdata,/uploads/,/cache/,/nextcloud.log

# ClamAV, asked only about files that already look wrong for another reason, and
# about the binary of any program that should not be writing here.
clam_enabled = true
clam_socket = /run/clamav/clamd.ctl
clam_max_bytes = 33554432
clam_scan_writers = true

# How often to write the heartbeat Nextcloud reads to know this is alive.
heartbeat = 60
