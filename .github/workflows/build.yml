name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fail if the build produced nothing
        # A build tool that no longer understands its configuration does not
        # always say so: it can finish happily and write an empty bundle, which
        # installs perfectly and then does nothing at all. Size is the only
        # thing that catches that.
        #
        # The entry points are thin on purpose — both mount the same console, so
        # Vite puts the real weight in a shared chunk — which is why the total is
        # what gets the meaningful threshold.
        run: |
          for bundle in js/sentinel-main.mjs js/sentinel-admin.mjs; do
            size=$(stat -c%s "$bundle" 2>/dev/null || echo 0)
            echo "$bundle is $size bytes"
            if [ "$size" -lt 120 ]; then
              echo "::error::$bundle is $size bytes, which means the build produced nothing usable"
              exit 1
            fi
          done
          total=$(cat js/*.mjs | wc -c)
          echo "all bundles together are $total bytes"
          if [ "$total" -lt 200000 ]; then
            echo "::error::the built JavaScript is only $total bytes in total, which means the build produced nothing usable"
            exit 1
          fi
          # An entry that imports a chunk which was never written installs fine
          # and then fails in the browser with nothing in any server log.
          for import in $(grep -ho 'from"\./[^"]*"' js/sentinel-*.mjs | sed 's/from"\.\///; s/"$//'); do
            if [ ! -f "js/$import" ]; then
              echo "::error::an entry point imports js/$import, which does not exist"
              exit 1
            fi
            echo "js/$import is present"
          done
      - name: Fail if the built files were not committed
        run: git diff --exit-code -- js/

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The app asks for PHP 8.4, so that is what it is checked against.
        # Nothing here is written for anything older on purpose.
        php: ['8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check every file parses
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check the declared minimum matches what is asked for
        run: |
          declared=$(grep -oP '<php min-version="\K[^"]+' appinfo/info.xml)
          if [ "$declared" != "${{ matrix.php }}" ]; then
            echo "info.xml asks for PHP $declared but this job runs ${{ matrix.php }}"
            exit 1
          fi

  edr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check every module compiles
        run: python3 -m compileall -q edr/sentinel_edr
      - name: Check the scoring, which is the part allowed to stop processes
        # The rule that must never break: rate alone must never be enough to
        # act. An ordinary busy day and an encryptor look identical if all you
        # count is files per minute.
        run: |
          python3 - <<'PY'
          import sys, time
          sys.path.insert(0, "edr")
          from sentinel_edr.verdict import Account, Write, judge

          def account(n, mismatch=0, checked=0, notes=0, strangers=0, hits=0):
              a = Account(uid="x", window=300.0)
              now = time.time()
              for i in range(n):
                  m = (i < mismatch) if i < checked else None
                  a.record(Write(at=now, mismatch=m, note=(i < notes), pid=(999 if i < strangers else 100),
                                 expected=(i >= strangers)))
              a.scanner_hits = ["x: Eicar"] * hits
              return a

          def verdict(a):
              return judge(a, rate_floor=400, mismatch_floor=5, mismatch_ratio=50, stranger_floor=20)

          failures = 0

          ordinary = [
              ("a phone finishing its backup", account(900, checked=120)),
              ("a photo library being moved", account(2000)),
              ("a few genuinely mislabelled files", account(900, mismatch=4, checked=120)),
          ]
          for label, a in ordinary:
              if verdict(a).act:
                  print(f"FAILED: acted on {label}")
                  failures += 1

          attacks = [
              ("fast, and the files are wrong", account(900, mismatch=100, checked=120)),
              ("slow, but the files are wrong", account(150, mismatch=60, checked=70)),
              ("a ransom note during a busy hour", account(900, notes=1, checked=100)),
              ("a known-malware binary writing", account(60, strangers=60, hits=1)),
          ]
          for label, a in attacks:
              if not verdict(a).act:
                  print(f"FAILED: missed ransomware ({label})")
                  failures += 1

          # Server-side encryption must never be read as an attack.
          from sentinel_edr import kinds
          if kinds.matches("holiday.jpg", b"HBEGIN:oc_encryption_module:OC_DEFAULT_MODULE") is not None:
              print("FAILED: Nextcloud's own encryption counted as evidence")
              failures += 1

          print("checks failed:", failures)
          sys.exit(1 if failures else 0)
          PY

      - name: Check the magic table has not drifted from the PHP one
        # The two sides must agree about what a JPEG looks like, or the daemon
        # and the app will reach different conclusions about the same file.
        run: |
          python3 - <<'PY'
          import re, sys
          sys.path.insert(0, "edr")
          from sentinel_edr.kinds import MAGIC

          php = open("lib/Service/FileKinds.php").read()
          block = php.split("private const MAGIC = [", 1)[1].split("\n\t];", 1)[0]
          php_kinds = set(re.findall(r"'([a-z0-9]+)' => \[\[", block))
          missing = php_kinds - set(MAGIC)
          extra = set(MAGIC) - php_kinds
          if missing or extra:
              print("the two magic tables disagree")
              print("  only in PHP:", sorted(missing))
              print("  only in Python:", sorted(extra))
              sys.exit(1)
          print(f"both tables know the same {len(php_kinds)} kinds")
          PY

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every translation file is valid JSON with a plural rule
        run: |
          for file in l10n/*.json; do
            python3 -c "
          import json, sys
          d = json.load(open('$file'))
          assert 'translations' in d, '$file has no translations'
          assert 'pluralForm' in d, '$file has no pluralForm'
          print('$file:', len(d['translations']), 'strings')
          "
          done
